context:
  name: microsoft-kiota-serialization-multipart
  version: 1.14.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/microsoft_kiota_serialization_multipart-${{ version }}.tar.gz
  sha256: cc2b4ca810351835a7e0f36c499fba396e3373ea337da10db177a07f53548a8f

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<5
  run:
    - python >=${{ python_min }},<4.0
    - microsoft-kiota-abstractions >=1.11.1,<2.0.0
tests:
  - python:
      imports:
        - kiota_serialization_multipart
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/microsoft/kiota-python/tree/main/packages/serialization/multipart
  summary: Core abstractions for kiota generated libraries in Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - xylar
